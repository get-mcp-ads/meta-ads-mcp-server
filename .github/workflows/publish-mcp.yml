# Publishes this server to the official MCP Registry when a version tag is pushed.
#
# Order matters: the registry verifies ownership by reading `mcpName` from the
# package already published on npm. So publish to npm first, then tag. A tag
# pushed before the npm release fails here, on purpose, rather than registering
# a version nobody can install.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Check the tag matches the manifests
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ]; then
            echo "Tag v$TAG, package.json $PKG, server.json $SRV. All three must match."
            exit 1
          fi

      - name: Check the npm release exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" mcpName 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "$NAME@$VERSION is not on npm, or carries no mcpName."
            echo "Publish to npm first: the registry reads mcpName from the published package."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate with the getmcpads.com domain
        run: ./mcp-publisher login dns --domain getmcpads.com --private-key "${{ secrets.MCP_DNS_PRIVATE_KEY }}"

      - name: Publish
        run: ./mcp-publisher publish
